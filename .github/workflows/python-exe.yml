name: Python EXE

on:
  pull_request:
    paths:
      - "app.py"
      - "Src/**"
      - "config/**"
      - "backends/**"
      - "pyproject.toml"
      - "build_exe.bat"
      - ".github/workflows/python-exe.yml"
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install project and build tools
        run: py -3 -m pip install -e ".[test,exe]"

      - name: Run tests
        run: py -3 -m pytest -q

      - name: Build onedir app
        shell: cmd
        run: build_exe.bat

      - name: Smoke test app
        shell: powershell
        run: |
          $exe = ".\dist\kadoka-code-atlas\kadoka-code-atlas.exe"
          $config = ".\dist\kadoka-code-atlas\config\kadoka-code-atlas.json"
          $backendManifest = ".\dist\kadoka-code-atlas\backends\manifest.json"
          $csharpBackend = ".\dist\kadoka-code-atlas\backends\csharp\kadoka-csharp-backend.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "EXE not found: $exe"
            exit 1
          }
          if (-not (Test-Path $config)) {
            Write-Error "Runtime config not found: $config"
            exit 1
          }
          if (-not (Test-Path $backendManifest)) {
            Write-Error "Backend manifest not found: $backendManifest"
            exit 1
          }
          if (-not (Test-Path $csharpBackend)) {
            Write-Error "C# backend not found: $csharpBackend"
            exit 1
          }
          $manifest = Get-Content $backendManifest -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne "1") {
            Write-Error "Unexpected backend manifest version: $($manifest.manifest_version)"
            exit 1
          }
          if ($manifest.parser_backend_contract_version -ne "1") {
            Write-Error "Unexpected parser backend contract version: $($manifest.parser_backend_contract_version)"
            exit 1
          }
          $output = & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -notmatch "Kadoka Code Atlas") {
            Write-Error "Unexpected EXE output: $output"
            exit 1
          }
          $backendOutput = & $exe backend-smoke gdscript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($backendOutput -notmatch "gdscript-tree-sitter") {
            Write-Error "GDScript backend smoke failed: $backendOutput"
            exit 1
          }
          $csharpOutput = & $exe backend-smoke csharp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($csharpOutput -notmatch "csharp-roslyn-helper") {
            Write-Error "C# backend smoke failed: $csharpOutput"
            exit 1
          }

      - name: Upload Windows app directory
        uses: actions/upload-artifact@v4
        with:
          name: kadoka-code-atlas-windows-x64
          path: dist/kadoka-code-atlas/**
          if-no-files-found: error
