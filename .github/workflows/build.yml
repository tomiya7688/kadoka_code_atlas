name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[test]"

      - name: Run project-operation tests
        # Full pytest is tracked by #23 because pre-existing comment-generator tests
        # currently fail during collection on main.
        run: python -m pytest tests/test_next_issue.py tests/test_context_tool.py

      - name: Check architecture policy
        run: python tools/context_tool.py policy-check

      - name: Smoke context indexes
        run: |
          python tools/context_tool.py profile > /tmp/kca-profile.json
          python tools/context_tool.py structure-index > /tmp/kca-structure.json
          python tools/context_tool.py doc-index > /tmp/kca-doc-index.json

      - name: Launch smoke test
        run: python app.py

      - name: Build package
        run: python -m build
